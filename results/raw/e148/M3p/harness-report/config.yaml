name: edge-agentic-full-run
version: '1.0'
type: online
model_params:
  name: nvidia/Qwen3.6-27B-NVFP4
  temperature: 0.0
  seed: 42
  max_new_tokens: 1024
  min_new_tokens: 1
  skip_special_tokens: true
  streaming: 'on'
  tokenizer_name: /opt/models/staging/qwen3.6-27b-nvfp4
datasets:
- name: agentic_coding
  type: performance
  path: /home/agent-spark/atlas-e146/endpoints/examples/11_Edge_Agentic_Example/agentic_coding_2.5h.jsonl
  accuracy_config:
    eval_method: agentic_inference_inline
    num_repeats: 1
  agentic_inference:
    turn_timeout_s: 600.0
    enable_salt: false
    inject_tool_delay: false
    routing_headers:
    - X-Session-ID
    num_trajectories_to_issue: 4
    stop_issuing_on_first_user_complete: false
settings:
  runtime:
    max_issue_duration_ms: 14400000
    scheduler_random_seed: 42
    dataloader_random_seed: 42
  load_pattern:
    type: agentic_inference
    target_concurrency: 1
  client:
    num_workers: 1
    log_level: INFO
    warmup_connections: 0
    auto_warmup_budget_fraction: 0.25
    max_concurrent_warmup_connects: 128
    max_connections: 1
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
      io_threads: 4
      worker_io_threads: 1
      high_water_mark: 0
      linger: -1
      immediate: 1
    stream_all_chunks: false
    worker_initialization_timeout: 60.0
    worker_graceful_shutdown_wait: 0.5
    worker_force_kill_timeout: 0.5
    insecure: false
    max_idle_time: 4.0
    min_required_connections: -1
    worker_gc_mode: relaxed
  timeouts:
    run_timeout_s: 21600.0
    interrupted_teardown_grace_s: 30.0
    service_ready_timeout_s: 30.0
    warmup_drain_timeout_s: 240.0
  warmup:
    enabled: false
    salt: false
    drain: false
    warmup_random_seed: 42
  profiling: {}
  early_stopping:
    enabled: true
  steady_state:
    enabled: false
  metrics_tokenizer_workers: 4
  metrics_isl: true
endpoint_config:
  endpoints:
  - http://127.0.0.1:8081
  api_type: openai
report_dir: /home/agent-spark/sparkbench/results/raw/e148/M3p/harness-report
verbose: false
enable_cpu_affinity: true
