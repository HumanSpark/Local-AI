; File: models-e94.ini
; Purpose: The three-model router preset for E94 - role aliases, not model names.
; Project: sparkbench | Date: 2026-08-31
;
; THE SECTION NAME IS THE ALIAS. llama.cpp's router routes on the requested
; model name, so `[fast]` is what a caller puts in {"model": "fast"}. The
; aliases are ROLES rather than model names on purpose: the models change week
; to week and the callers must not.
;
; --models-preset, never --models-dir. /opt/models/staging holds 100 GB+
; artefacts and --models-dir plus autoload could pull one straight through the
; memory edge. A preset names exactly what is allowed (F40).

version = 1

[*]
; Per-model context. E94 arm D raises this to find the real ceiling; 32768 is
; the registered floor because it is the smallest context that covers the l3
; pack, below which a resident model cannot do document work at all.
c = 32768
; Frozen to production's KV precision so the memory figure transfers (F110:
; q8_0 costs 0.017% perplexity against f16).
ctk = q8_0
ctv = q8_0
fa = on
; -np is left AUTO deliberately. Explicit -np SPLITS the KV pool where omitting
; it shares one; writing the number down reads as inert and quarters every
; conversation's context (E89/F108).

[fast]
model = /opt/models/staging/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
load-on-startup = true


