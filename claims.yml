  - id: C-CODING-RECOMMENDED-TIE-001
    statement: "Seven coding models recommended by a Strix Halo chat and a comparison widget (Qwen3.8-27B, Qwen3.8-Flash-Next, two quants of Qwen3.6-35B-A3B, Ornith 1.0 and 1.5, Qwen3.6-27B) tie with the incumbent Qwen3-Coder through Aider on three real repo tasks: 5 to 7 passes of 9 for every model against a pre-registered band of 4 for a real difference, with the incumbent 2x to 10x faster per attempt set. The widget's speed order held (its 'faster' option is 39% faster; it said 42%) and its 27B penalty did not (4.7x, it said 2.09x). Every failure on the task the incumbent passes carries only the seed diff: the other models' edits never reached the file (F171)."
    value: null
    unit: "qualitative"
    confidence_interval: null
    status: active
    evidence:
      - results/e145-results.md
