    statement: "With sixteen people asking sixteen different questions at once, the MoE workhorse delivers about 1.53 times the throughput of a single user - not the 2.66 times a same-question benchmark suggests. Mixture-of-Experts models route each token to a few specialists, so when concurrent requests differ the machine must fetch far more of the model per step. Conventional dense models do not behave this way (no measurable penalty), and a single user is unaffected either way."
