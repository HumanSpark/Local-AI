  - id: C-TRANSCRIPTION-WER-001
    statement: "On the standard read-speech benchmark (LibriSpeech test-clean, human transcripts), local Whisper large-v3-turbo transcribes at a 2.40% word error rate, matching the published figure for the model - which validates the measurement harness as well as the number. The smaller model is worse (3.35%), and the larger model is about 28% more accurate on real meeting audio too: our own hypothesis that smaller models might transcribe better was tested and refuted. This is clean read speech, the easy case; it is the model comparison and a harness check, not a meeting-accuracy figure. (F45, E42/E45.)"
    value: 2.4
    unit: "percent_word_error_rate"
    confidence_interval: null
    status: active
    evidence:
      - results/transcription/e45-true-wer.md
  - id: C-TRANSCRIPTION-SILENCE-VAD-001
    statement: "Voice-activity detection is mandatory, not optional, for Whisper transcription: without it the model fabricates about two invented utterances per minute of silence (97% of them the phrase 'Thank you.'), and voice-activity detection removes them completely (zero across 72 test conditions). This is a well-documented failure mode in the literature, reproduced here, not a discovery. One reframing is ours: counted by volume the smaller model hallucinates more, but counted by HARM the larger model is about five times worse, because it invents grammatical speech a reader cannot distinguish from a real utterance while the smaller model labels the gap as blank. (F44, E41.)"
    value: null
    unit: "operational_guidance"
    confidence_interval: null
    status: active
    evidence:
      - docs/FINDINGS.md
  - id: C-TARGET-SPEAKER-001
    statement: "Asking 'is this the host speaking or someone else' - a binary question - is far more tractable than full speaker diarisation and is what meeting intelligence actually needs. From a single ~4-minute voiceprint of the host, the system tags 97.2% of transcript lines correctly as host-versus-other across four real calls (a separate enrollment recording, so genuine cross-session performance). The difficulty inverts against general diarisation: more people in the room makes the binary question easier, not harder. General diarisation is the harder problem and a specialist tool (pyannote) still beats ours roughly three-to-one on it; the reframe to the host-versus-other question is what makes the product work. (F46, E50.)"
    value: 97.2
    unit: "percent_segment_attribution"
    confidence_interval: null
    status: active
    evidence:
      - results/diarisation/e50-target-speaker.md
  - id: C-DIARISATION-FARFIELD-001
    statement: "An on-prem meeting box does not need a headset per person: on the standard meeting corpus a single distant table microphone came within about one diarisation-error point of close-talk headsets (21.1% versus 20.2%), against a predicted eight-point penalty. Replacing a naive energy gate with a real voice-activity detector was what closed most of the gap, nearly halving the error. (F46, E44.)"
    value: null
    unit: "qualitative"
    confidence_interval: null
    status: active
    evidence:
      - results/diarisation/e44-vad-fix.md
  - id: C-CLAIM-BONSAI-SPEED-001
    statement: "A public '~73 tok/s on Strix Halo' for Ternary Bonsai 2 27B does not reproduce: 34.16 tok/s was the best of nine configurations (PQ2_0 plus a DFlash2 drafter, code prompt), and the claim's own 10.1 GB memory figure matches the PTQ1_0 configuration, which decodes at 3.63 tok/s on this Vulkan stack. Plain Bonsai runs 22.22 tok/s in 8.07 GiB against the incumbent 27B's 12.33 in 16.78 GiB; answer quality was not measured, so no swap is recommended on speed alone."
    value: 34.16
    unit: "tokens_per_second_decode"
