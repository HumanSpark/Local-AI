  - id: C-TOOLUSE-CONDITIONAL-001
    statement: "Reasoning inside a tool call is unreliable for most local models: told to mark a document urgent only when a balance exceeded a threshold, the Qwen family and gpt-oss applied the flag unconditionally; Mistral was the exception. The mechanical step (make the file, send the message) is dependable; the judgement inside it still needs a human check. (F38, E33.)"
